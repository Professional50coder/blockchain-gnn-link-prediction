<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="730" viewBox="0 0 2000 730"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1B2430"/></marker></defs><rect width="2000" height="730" fill="#FBFCFD"/><text x="999" y="48" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="15" fill="#A32E27" font-weight="500" text-anchor="middle" letter-spacing="1.8">NO NEURAL NETWORK RUNS RIGHT OF THIS LINE</text><line x1="999" y1="62" x2="999" y2="596" stroke="#A32E27" stroke-width="2" stroke-dasharray="9 7"/><rect x="36" y="96" width="384" height="460" rx="4" fill="#F1F4F7" stroke="#94A3B4" stroke-width="1.4"/><text x="58" y="130" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14.5" fill="#5A6675" font-weight="500" letter-spacing="1.4">INPUT · WHAT THE ANALYST TYPES</text><rect x="58" y="156" width="340" height="104" rx="3" fill="#FFFFFF" stroke="#E3E8ED" stroke-width="1.2"/><text x="76" y="196" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="19" fill="#1B2430">Two 0x addresses</text><text x="76" y="224" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14.5" fill="#5A6675">link prediction · manual or random</text><rect x="58" y="274" width="340" height="104" rx="3" fill="#FFFFFF" stroke="#E3E8ED" stroke-width="1.2"/><text x="76" y="314" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="19" fill="#1B2430">One wallet id</text><text x="76" y="342" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14.5" fill="#5A6675">fraud investigation · picked from table</text><rect x="58" y="392" width="340" height="104" rx="3" fill="#FFFFFF" stroke="#E3E8ED" stroke-width="1.2"/><text x="76" y="432" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="19" fill="#1B2430">A live mainnet address</text><text x="76" y="460" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14.5" fill="#5A6675">explorer · never seen in training</text><text x="58" y="536" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" fill="#5A6675" font-weight="500" letter-spacing="1.1">THE ONLY HUMAN INPUT IN THE SYSTEM.</text><rect x="550" y="96" width="384" height="460" rx="4" fill="#FBF6EE" stroke="#B8863A" stroke-width="1.4"/><text x="572" y="130" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14.5" fill="#96702A" font-weight="500" letter-spacing="1.4">RESOLUTION · ADDRESS TO VECTOR</text><rect x="572" y="156" width="340" height="104" rx="3" fill="#FFFFFF" stroke="#E3E8ED" stroke-width="1.2"/><rect x="572" y="156" width="5" height="104" rx="2.5" fill="#A32E27"/><text x="594" y="196" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="19" fill="#1B2430">label_encoder.pkl</text><text x="594" y="224" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14.5" fill="#5A6675">address → node id, or 'unknown wallet'</text><rect x="572" y="274" width="340" height="104" rx="3" fill="#FFFFFF" stroke="#E3E8ED" stroke-width="1.2"/><text x="590" y="314" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="19" fill="#1B2430">z[id] lookup</text><text x="590" y="342" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14.5" fill="#5A6675">one row of node_embeddings.npy</text><rect x="572" y="392" width="340" height="104" rx="3" fill="#FFFFFF" stroke="#E3E8ED" stroke-width="1.2"/><text x="590" y="432" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="19" fill="#1B2430">64 float32</text><text x="590" y="460" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14.5" fill="#5A6675">the wallet's entire learned identity</text><text x="572" y="536" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" fill="#96702A" font-weight="500" letter-spacing="1.1">A WALLET WITH NO ID CANNOT BE SCORED.</text><rect x="1064" y="96" width="384" height="460" rx="4" fill="#F0F7F3" stroke="#3D8F6A" stroke-width="1.4"/><text x="1086" y="130" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14.5" fill="#2E7357" font-weight="500" letter-spacing="1.4">SCORING · THREE SIGNALS, ONE NUMBER</text><rect x="1086" y="156" width="340" height="104" rx="3" fill="#FFFFFF" stroke="#E3E8ED" stroke-width="1.2"/><text x="1104" y="196" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="19" fill="#1B2430">dot(a, b) × 0.5</text><text x="1104" y="224" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14.5" fill="#5A6675">raw magnitude of interaction</text><rect x="1086" y="274" width="340" height="104" rx="3" fill="#FFFFFF" stroke="#E3E8ED" stroke-width="1.2"/><text x="1104" y="314" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="19" fill="#1B2430">cos(a, b) · |dot| × 0.3</text><text x="1104" y="342" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14.5" fill="#5A6675">behavioural alignment</text><rect x="1086" y="392" width="340" height="104" rx="3" fill="#FFFFFF" stroke="#E3E8ED" stroke-width="1.2"/><text x="1104" y="432" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="19" fill="#1B2430">1/(1+‖a−b‖) · |dot| × 0.2</text><text x="1104" y="460" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14.5" fill="#5A6675">proximity in embedding space</text><text x="1086" y="536" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" fill="#2E7357" font-weight="500" letter-spacing="1.1">SUM → CLIP ±500 → SIGMOID.</text><rect x="1578" y="96" width="384" height="460" rx="4" fill="#F1F4F7" stroke="#94A3B4" stroke-width="1.4"/><text x="1600" y="130" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14.5" fill="#5A6675" font-weight="500" letter-spacing="1.4">VERDICT · WHAT COMES BACK</text><rect x="1600" y="156" width="340" height="104" rx="3" fill="#FFFFFF" stroke="#E3E8ED" stroke-width="1.2"/><text x="1618" y="196" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="19" fill="#1B2430">P(edge) 0.00 – 1.00</text><text x="1618" y="224" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14.5" fill="#5A6675">&gt; 0.7 strong · 0.4–0.7 moderate · &lt; 0.4 weak</text><rect x="1600" y="274" width="340" height="104" rx="3" fill="#FFFFFF" stroke="#E3E8ED" stroke-width="1.2"/><text x="1618" y="314" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="19" fill="#1B2430">Risk 0 – 100</text><text x="1618" y="342" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14.5" fill="#5A6675">Low · Medium · High · Critical</text><rect x="1600" y="392" width="340" height="104" rx="3" fill="#FFFFFF" stroke="#E3E8ED" stroke-width="1.2"/><text x="1618" y="432" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="19" fill="#1B2430">Nearest neighbours</text><text x="1618" y="460" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14.5" fill="#5A6675">top-5 by cosine — wallets that behave alike</text><text x="1600" y="536" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14" fill="#5A6675" font-weight="500" letter-spacing="1.1">A RANKING, NOT AN ACCUSATION.</text><line x1="426" y1="326" x2="542" y2="326" stroke="#1B2430" stroke-width="1.6" marker-end="url(#ar)"/><text x="484.0" y="310" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="16" fill="#1B2430" text-anchor="middle">resolve</text><text x="484.0" y="352" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13.5" fill="#5A6675" text-anchor="middle">encoder lookup</text><line x1="940" y1="326" x2="1056" y2="326" stroke="#1B2430" stroke-width="1.6" marker-end="url(#ar)"/><rect x="942.0" y="294" width="112" height="22" fill="#FBFCFD"/><rect x="942.0" y="338" width="112" height="20" fill="#FBFCFD"/><text x="998.0" y="310" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="16" fill="#1B2430" text-anchor="middle">score</text><text x="998.0" y="352" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13.5" fill="#5A6675" text-anchor="middle">pure NumPy</text><line x1="1454" y1="326" x2="1570" y2="326" stroke="#1B2430" stroke-width="1.6" marker-end="url(#ar)"/><text x="1512.0" y="310" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="16" fill="#1B2430" text-anchor="middle">band</text><text x="1512.0" y="352" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="13.5" fill="#5A6675" text-anchor="middle">threshold + label</text><rect x="36" y="623" width="16" height="16" rx="2.5" fill="#FFFFFF" stroke="#94A3B4" stroke-width="1.8"/><text x="62" y="636" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="15" fill="#5A6675">Input / output</text><rect x="256" y="623" width="16" height="16" rx="2.5" fill="#FFFFFF" stroke="#B8863A" stroke-width="1.8"/><text x="282" y="636" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="15" fill="#5A6675">Resolution</text><rect x="486" y="623" width="16" height="16" rx="2.5" fill="#FFFFFF" stroke="#3D8F6A" stroke-width="1.8"/><text x="512" y="636" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="15" fill="#5A6675">Scoring</text><rect x="716" y="622" width="5" height="18" rx="2.5" fill="#A32E27"/><text x="742" y="636" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="15" fill="#5A6675">Crimson edge = the step that can fail</text><line x1="1200" y1="631" x2="1230" y2="631" stroke="#A32E27" stroke-width="2" stroke-dasharray="7 5"/><text x="1240" y="636" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="15" fill="#5A6675">No model is loaded on either path</text><text x="36" y="682" font-family="'Segoe UI', system-ui, -apple-system, Roboto, sans-serif" font-size="14.5" fill="#5A6675">The decoder is a weighted blend, not a plain dot product: dot alone rewards busy wallets for being busy, so cosine and distance re-weight it by how aligned and how close the two wallets actually are (utils/ml_utils.py:30).</text></svg>